<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Browse sneakers from Air Jordan, Yeezy and New Balance at Mova. Search, filter, and sort to find your perfect pair.">
  <title>Products | Mova</title>
  <link rel="icon" type="image/png" href="assets/img/Mova site logo.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">

  <!-- AOS -->
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

  <!-- Site CSS -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div data-include="assets/partials/navbar.html"></div>

  <!-- Page Header -->
  <div class="py-5 text-center" style="background-color: #1c1c1c;">
    <h1 class="text-white fw-bold">All Products</h1>
    <p class="text-secondary mb-0">Discover authentic sneakers from the world's best brands</p>
  </div>

  <!-- Product Listing -->
  <div class="container my-5">
    <div class="row g-2 mb-4" data-aos="fade-up">
      <div class="col-md-5">
        <input id="search" class="form-control" placeholder="Search products…" aria-label="Search products">
      </div>
      <div class="col-md-3">
        <select id="brand" class="form-select" aria-label="Filter by brand">
          <option value="">All brands</option>
        </select>
      </div>
      <div class="col-md-4">
        <select id="sort" class="form-select" aria-label="Sort products">
          <option value="">Sort by</option>
          <option value="price-asc">Price: low to high</option>
          <option value="price-desc">Price: high to low</option>
          <option value="name">Name A–Z</option>
        </select>
      </div>
    </div>

    <div id="product-list" class="row g-4"></div>

    <nav aria-label="Product pages">
      <ul id="pagination" class="pagination justify-content-center mt-4"></ul>
    </nav>
  </div>

  <div data-include="assets/partials/footer.html"></div>

  <!-- Scripts -->
  <script src="assets/js/include.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/products.js"></script>
</body>
</html>
