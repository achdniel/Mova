<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Product detail page – Mova Sneaker Marketplace">
  <title>Product | Mova</title>
  <link rel="icon" type="image/png" href="assets/img/Mova site logo.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">

  <!-- Site CSS -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div data-include="assets/partials/navbar.html"></div>

  <main class="container my-5" id="detail">
    <div class="text-center py-5 text-muted">Loading product…</div>
  </main>

  <div data-include="assets/partials/footer.html"></div>

  <!-- Scripts -->
  <script src="assets/js/include.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe" crossorigin="anonymous"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    const rupiah = n => new Intl.NumberFormat("id-ID", { style: "currency", currency: "IDR", maximumFractionDigits: 0 }).format(n);
    const id = new URLSearchParams(location.search).get("id");

    fetch("assets/data/products.json")
      .then(r => r.json())
      .then(list => {
        const p = list.find(x => x.id === id);
        const box = document.getElementById("detail");
        if (!p) {
          box.innerHTML = `<div class="text-center py-5"><h2>Product not found</h2><a class="btn btn-dark mt-3" href="products.html">Browse products</a></div>`;
          return;
        }
        document.title = p.name + " | Mova";
        document.querySelector('meta[name="description"]').setAttribute("content", p.description);
        box.innerHTML = `
          <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb">
              <li class="breadcrumb-item"><a href="products.html">Products</a></li>
              <li class="breadcrumb-item"><a href="products.html?brand=${encodeURIComponent(p.brand)}">${p.brand}</a></li>
              <li class="breadcrumb-item active" aria-current="page">${p.name}</li>
            </ol>
          </nav>
          <div class="row g-4 align-items-start">
            <div class="col-md-6 text-center">
              <img src="${p.image}" class="img-fluid rounded shadow" alt="${p.name}" style="max-height:420px; object-fit:contain;">
            </div>
            <div class="col-md-6">
              <small class="text-muted text-uppercase fw-semibold">${p.brand}</small>
              <h1 class="h2 mt-1">${p.name}</h1>
              <h2 class="h4 fw-bold mt-3">${rupiah(p.price)}</h2>
              <hr>
              <h3 class="h6 text-secondary-emphasis mt-3">About this product</h3>
              <p class="text-secondary mt-2">${p.description}</p>
              <button class="btn btn-dark px-5 mt-3" data-add-to-cart onclick="addToCart('${p.id}')">Add to cart</button>
              <a class="btn btn-outline-dark px-5 mt-3 ms-2" href="payment.html">Checkout</a>
            </div>
          </div>`;
      })
      .catch(() => {
        document.getElementById("detail").innerHTML = `<p class="text-center text-danger py-5">Failed to load product. Please try again.</p>`;
      });
  </script>
</body>
</html>
